# Defaults und Szenarien für den Klimarechner.
#
# ACHTUNG: Alle Zahlenwerte in dieser Datei sind PLATZHALTER.
# Sie sind plausibel gewählt, aber nicht fachlich geprüft und müssen vor
# einer Nutzung im Kundengespräch verifiziert werden (siehe SPEC Abschnitt 3).
#
# Aufbau:
#   eingaben:  alles, was der Installateur in der Maske ändern kann
#   annahmen:  Tabellen, Szenarien und Modellfaktoren (Bereich "Erweitert")

meta:
  platzhalter: true
  stand: "2026-10-10"

eingaben:
  standort:
    # Geografische Mitte Deutschlands
    breitengrad: 51.16
    laengengrad: 10.45

  gebaeude:
    beheizte_flaeche_m2: 140
    split_flaeche_m2: 60
    baualtersklasse: "1979_1994"
    t_soll_heizen_c: 21
    t_soll_kuehlen_c: 25
    heizgrenztemperatur_c: 15

  geraete:
    anzahl_innengeraete: 2
    # Nennleistung je Innengerät
    nennleistung_heizen_kw: 3.2
    nennleistung_kuehlen_kw: 2.5
    scop: 4.6
    seer: 7.0
    # Optional: COP an den Prüfpunkten nach EN 14825 (°C -> COP).
    # Ohne Angabe wird eine Kurve aus dem SCOP abgeleitet.
    cop_pruefpunkte: null
    # Optional: EER bei Außentemperatur (°C -> EER). Ohne Angabe aus SEER.
    eer_pruefpunkte: null

  nutzung:
    # uebergangszeit | bevorzugt_split | vollheizung_teilraeume
    heizstrategie: "uebergangszeit"
    # Bei "uebergangszeit": Split heizt nur oberhalb dieser Außentemperatur
    split_schwelltemperatur_c: 5
    kuehlen_aktiv: true

  pv:
    # keine | vorhanden | neu
    status: "vorhanden"
    leistung_kwp: 8.0
    # PVGIS-Konvention: 0 = Süd, -90 = Ost, 90 = West
    azimut_grad: 0
    neigung_grad: 30
    systemverluste_prozent: 14

  speicher:
    # keine | vorhanden | neu
    status: "keine"
    kapazitaet_kwh: 8.0
    ladeleistung_kw: 4.0
    entladeleistung_kw: 4.0
    # Wirkungsgrad je Richtung (Laden bzw. Entladen)
    wirkungsgrad: 0.95
    soc_min: 0.05
    soc_max: 1.0

  haushalt:
    jahresverbrauch_kwh: 3500

  bestand:
    # gas | oel
    heiztraeger: "gas"
    kesselwirkungsgrad: 0.90

  preise:
    strom_bezug_eur_kwh: 0.35
    # Preis je kWh Endenergie (Gas: bezogen auf Brennwert der Abrechnung)
    brennstoff_eur_kwh: 0.11
    einspeiseverguetung_eur_kwh: 0.08
    # Schlüssel aus annahmen.preisszenarien
    szenario: "moderat"

  kosten:
    investition_split_eur: 6000
    investition_pv_eur: 0
    investition_speicher_eur: 0
    wartung_eur_jahr: 150

  rahmen:
    betrachtungszeitraum_jahre: 15
    kalkulationszins: 0.03

  montecarlo:
    pfade: 1000
    seed: 42
    # Anzahl unterschiedlicher Parametersätze (Verhalten/Technik), die je
    # Wetterjahr stündlich simuliert werden; Pfade ziehen daraus
    parametersaetze: 100

annahmen:
  # Spezifische Heizlast in W/m² bei Norm-Außentemperatur
  spezifische_heizlast_w_m2:
    vor_1949: 150
    "1949_1978": 130
    "1979_1994": 100
    "1995_2009": 70
    ab_2010: 45
    effizienzhaus: 30

  # Norm-Außentemperatur für die Umrechnung Heizlast -> H [W/K].
  # Vereinfachung: ein Wert für alle Standorte.
  norm_aussentemperatur_c: -12

  kuehlen:
    # Gekühlt wird nur in Stunden mit Außentemperatur ab diesem Wert
    kuehlgrenztemperatur_c: 20
    # a_solar: effektive Fläche in m², mit der die Einstrahlung auf die
    # PV-Ebene [W/m²] zur Kühllast beiträgt. Herleitung für 60 m² Split-Fläche:
    # ca. 12 m² Fenster x g-Wert 0,6 x Rahmenanteil 0,7 x Verschattung 0,9
    # x Ausrichtung gegenüber der PV-Ebene 0,7 = ca. 3 m²
    solarfaktor_m2: 3.0
    # Interne Lasten in den Split-Räumen
    interne_lasten_w: 200
    # Trägheit: Solare Gewinne wirken über Bauteile verzögert (PT1). Damit
    # fällt ein Teil der Kühlung in den Abend, wenn keine PV mehr läuft.
    # 0 = keine Verzögerung
    zeitkonstante_solar_h: 6

  waermepumpe:
    # Prüfpunkte nach EN 14825 für Heizen
    pruefpunkte_heizen_c: [-7, 2, 7, 12]
    # Untere/obere Grenze für extrapolierte COP/EER-Werte
    cop_min: 1.0
    cop_max: 10.0
    # Abtauabschlag auf den COP im Temperaturband um 0 °C
    abtau_band_c: [-5, 5]
    abtau_abschlag: 0.10
    # Pauschaler Teillastabschlag auf COP/EER
    teillast_abschlag: 0.05
    # Abschlag Praxis gegenüber Prüfstand (Taktung, Ventilator, Regelung,
    # Installation). Wirkt nach der Kalibrierung auf SCOP/SEER, d. h. die
    # simulierte Saisonzahl liegt um diesen Anteil unter dem Datenblattwert.
    praxisabschlag: 0.15
    # Maximale Heizleistung relativ zur Nennleistung (°C -> Faktor)
    leistungsfaktor_heizen:
      -15: 0.70
      -7: 0.85
      7: 1.00
      12: 1.00
    # Carnot-Gütegrad-Modell (Fallback ohne Prüfpunkte)
    carnot:
      kondensation_heizen_c: 40
      verdampfer_abstand_k: 6
      verdampfung_kuehlen_c: 10
      kondensator_abstand_k: 10
    # Referenzklima zur Kalibrierung auf SCOP/SEER: Stunden je
    # Temperaturklasse (Näherung an EN 14825, Klima "Average"; prüfen!)
    referenzklima_heizen:
      auslegungstemperatur_c: -10
      heizgrenze_c: 16
      stunden:
        -10: 1
        -9: 25
        -8: 23
        -7: 24
        -6: 27
        -5: 68
        -4: 91
        -3: 89
        -2: 165
        -1: 173
        0: 240
        1: 280
        2: 320
        3: 357
        4: 356
        5: 303
        6: 330
        7: 326
        8: 348
        9: 335
        10: 315
        11: 215
        12: 169
        13: 151
        14: 105
        15: 74
    referenzklima_kuehlen:
      auslegungstemperatur_c: 35
      kuehlgrenze_c: 16
      stunden:
        17: 205
        18: 227
        19: 225
        20: 225
        21: 216
        22: 215
        23: 218
        24: 197
        25: 178
        26: 158
        27: 137
        28: 109
        29: 88
        30: 63
        31: 39
        32: 31
        33: 24
        34: 17
        35: 13
        36: 9
        37: 4
        38: 3
        39: 1

  haushalt:
    # Standardlastprofil (CSV unter data/lastprofile/<name>.csv)
    lastprofil: "h0_naeherung"
    # Multiplikatives Rauschen je Stunde (Standardabweichung, relativ)
    rauschen_sigma: 0.15

  pvgis:
    api_url: "https://re.jrc.ec.europa.eu/api/v5_3/seriescalc"
    startjahr: 2005
    endjahr: 2023
    # Zeitversatz der PVGIS-Zeitreihe (UTC) zur Ortszeit ohne Sommerzeit
    zeitversatz_h: 1

  brennstoffe:
    # CO2-Emissionsfaktoren in kg/kWh Endenergie
    co2_kg_kwh:
      gas: 0.201
      oel: 0.266

  # Preispfade: korrelierte log-normale Entwicklung je Jahr.
  # drift = erwartete jährliche Änderung, volatilitaet = Standardabweichung
  # der jährlichen log-Rendite, korrelation = Strom vs. Brennstoff.
  preisszenarien:
    moderat:
      strom_drift: 0.02
      strom_volatilitaet: 0.05
      brennstoff_drift: 0.03
      brennstoff_volatilitaet: 0.08
      korrelation: 0.5
      co2_aufschlag_eur_t: 0
    steigend:
      strom_drift: 0.03
      strom_volatilitaet: 0.05
      brennstoff_drift: 0.06
      brennstoff_volatilitaet: 0.10
      korrelation: 0.5
      co2_aufschlag_eur_t: 50
    volatil:
      strom_drift: 0.02
      strom_volatilitaet: 0.12
      brennstoff_drift: 0.03
      brennstoff_volatilitaet: 0.20
      korrelation: 0.6
      co2_aufschlag_eur_t: 0

  # Plausibilitätsbereiche; Abweichungen werden als Warnung geloggt
  plausibilitaet:
    # Realistische Jahresarbeitszahl Heizen für Luft-Luft-Geräte (bei reinem
    # Übergangszeitbetrieb liegt sie naturgemäß höher als bei Vollheizung)
    jaz_heizen: [2.5, 5.0]

  # Streuung im Monte-Carlo
  verhalten:
    # Standardabweichung der Sollwerte in K
    sigma_t_soll_k: 0.5
    # Standardabweichung der Split-Schwelltemperatur in K
    sigma_schwelle_k: 1.0
  technik:
    # COP-Abschlag gleichverteilt zwischen min und max
    cop_abschlag_min: 0.0
    cop_abschlag_max: 0.10
