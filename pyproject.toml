[project]
name = "klimarechner"
version = "0.1.0"
description = "Wirtschaftlichkeitsrechner für Split-Klimaanlagen (Luft-Luft-WP) mit PV und Speicher"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
app = ["streamlit>=1.35", "plotly>=5.20", "reportlab>=4.0", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.5", "pypdf>=4.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
